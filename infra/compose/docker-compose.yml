# Local parity stack and VPS exit target: Postgres 18 + MinIO + the four apps behind one Caddy edge.
# Only Caddy publishes ports (3000/3001/3002 → console/ops/admin). It overwrites X-Forwarded-For
# with the real client address, which is why the API runs with TRUSTED_PROXY_HOPS=1.
#   cp infra/compose/.env.compose.example infra/compose/.env.compose  (replace the placeholders)
#   docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env.compose up -d --build
# Images are built from the repo root with infra/docker/next-app.Dockerfile.
name: ros

x-build: &build
  context: ../..
  dockerfile: infra/docker/next-app.Dockerfile

x-frontend-env: &frontend-env
  NODE_ENV: production
  API_INTERNAL_URL: http://api:4000
  # The proxy signs the browser's address for the API's rate limits (same value as the API).
  PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?set PROXY_SHARED_SECRET}
  # Proxies in front of this frontend (a Caddy/TLS terminator on a VPS counts as the one hop).
  TRUSTED_PROXY_HOPS: 1
  CONSOLE_URL: ${CONSOLE_URL:-http://localhost:3000}
  OPS_URL: ${OPS_URL:-http://localhost:3001}
  ADMIN_URL: ${ADMIN_URL:-http://localhost:3002}
  APP_VERSION: ${APP_VERSION:-compose}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurantos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-restaurantos}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-restaurantos} -d ${POSTGRES_DB:-restaurantos}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # MinIO no longer publishes community images on Docker Hub; the frozen Bitnami
  # build (same server, same S3 API) creates the uploads bucket itself.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-ros-uploads}
    volumes:
      - minio:/bitnami/minio/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies migrations as the database owner, then syncs system data.
  migrate:
    build:
      <<: *build
      target: migrate
      args:
        APP: api
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-restaurantos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-restaurantos}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: gives the runtime role (created NOLOGIN by the migrations) a login.
  roles:
    image: postgres:18
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./init-roles.sql:/init-roles.sql:ro
    command: >
      psql -h postgres -U ${POSTGRES_USER:-restaurantos} -d ${POSTGRES_DB:-restaurantos}
      -v ON_ERROR_STOP=1 -v pw="${RUNTIME_PASSWORD:?set RUNTIME_PASSWORD}" -v db="${POSTGRES_DB:-restaurantos}"
      -f /init-roles.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      <<: *build
      args:
        APP: api
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: ${CONSOLE_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${CONSOLE_URL:-http://localhost:3000},${OPS_URL:-http://localhost:3001},${ADMIN_URL:-http://localhost:3002}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      APP_VERSION: ${APP_VERSION:-compose}
      # Caddy (the only published entry point) sets x-forwarded-for; the frontends relay it unchanged
      # and, with the shared secret, add the signed x-ros-client-ip header (the browser's own address).
      TRUSTED_PROXY_HOPS: 1
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?set PROXY_SHARED_SECRET}
      DATABASE_PROVIDER: postgres
      # Connects as the runtime role; tenant transactions switch to ros_tenant (RLS).
      DATABASE_URL: postgres://ros_runtime:${RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-restaurantos}
      DATABASE_TENANT_ROLE: ros_tenant
      REALTIME_PROVIDER: postgres
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-ros-uploads}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      EMAIL_PROVIDER: outbox
      PAYMENT_PROVIDER: none
      PUSH_PROVIDER: none
      COOKIE_SECURE: "false"
    # Not published: reachable only from the frontends on the compose network.
    depends_on:
      roles:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

  console:
    build:
      <<: *build
      args:
        APP: console
    environment:
      <<: *frontend-env
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ops:
    build:
      <<: *build
      args:
        APP: ops
    environment:
      <<: *frontend-env
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      <<: *build
      args:
        APP: admin
    environment:
      <<: *frontend-env
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Edge: the only published ports. Overwrites client-supplied X-Forwarded-* headers.
  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    depends_on:
      - console
      - ops
      - admin
    restart: unless-stopped

volumes:
  pgdata:
  minio:
