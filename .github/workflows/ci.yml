name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Staging deploys call this workflow first (deploy-staging.yml); a push to
  # staging therefore runs CI once, inside the deploy pipeline.
  workflow_call:
    inputs:
      full:
        description: Run every package instead of only the affected ones
        type: boolean
        default: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Base commit for "affected" filters: the PR base, or the previous commit on main.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
  # Full runs: deploy pipelines, and pushes whose base is unknown (a new branch).
  CI_FULL: ${{ inputs.full == true || github.event.before == '0000000000000000000000000000000000000000' }}

jobs:
  # Only the packages and apps changed since the base (and their dependents) run.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit + integration tests, build
        env:
          TRUSTED_PROXY_HOPS: "1"
        run: |
          if [ "$CI_FULL" = "true" ]; then
            pnpm exec turbo run typecheck lint test build
          else
            pnpm exec turbo run typecheck lint test build --filter="...[${TURBO_SCM_BASE}]"
          fi
      - name: Root files
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm exec eslint --max-warnings=0 .
          pnpm format:check
          pnpm test:codemod

  # Role, grant and realtime behaviour PGlite cannot reproduce.
  integration-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 18 client (pg_dump/pg_restore for the restore suite)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
      - name: RLS roles and dump/restore on PostgreSQL
        run: pnpm --filter @ros/api exec vitest run tests/integration/security-rls.test.ts tests/integration/db-restore-postgres.test.ts tests/integration/postgres-resilience.test.ts
      - name: Postgres realtime bus
        run: pnpm --filter @ros/adapters exec vitest run src/realtime/providers/postgres-bus.test.ts

  # The S3 contract against MinIO.
  storage-s3:
    runs-on: ubuntu-latest
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: ros-test
      S3_TEST_ACCESS_KEY: minio
      S3_TEST_SECRET_KEY: minio-dev-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO
        # MinIO no longer publishes community images on Docker Hub; the frozen
        # Bitnami build creates the test bucket itself.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio-dev-secret \
            -e MINIO_DEFAULT_BUCKETS=ros-test \
            bitnamilegacy/minio:2025.5.24
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          for i in $(seq 1 30); do docker exec minio mc ls local/ros-test >/dev/null 2>&1 && break; sleep 1; done
      - name: S3 object storage contract
        run: pnpm --filter @ros/adapters exec vitest run src/storage/providers/s3-storage.test.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level=high

  # One image per app, built (never pushed) only when that app's turbo graph changed.
  # Production builds of api, console and ops with a seeded embedded database:
  # app shell, service worker, offline queue and the money-never-offline rules.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ inputs.full == true || github.event_name == 'push' }}
    env:
      DATABASE_PROVIDER: pglite
      PGLITE_DATA_DIR: ${{ github.workspace }}/.e2e-pglite
      APP_SECRET: ci-e2e-only-secret-not-for-production-0123456789
      TRUSTED_PROXY_HOPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: touch .env.local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test:e2e
      # The consent flow with a fake GA4 stream id, on the builds above. Every request to a
      # Google host is answered inside the browser context (context.route): nothing is sent.
      - name: Analytics consent (fake GA4 stream)
        env:
          GA_MEASUREMENT_ID: G-E2ETEST01
          E2E_SKIP_BUILD: "1"
        run: pnpm test:e2e tests/e2e/analytics-consent.spec.ts

  # Build-only image check for pull requests; deploys build and push their own.
  images:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ inputs.full != true }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, console, ops, admin]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Is @ros/${{ matrix.app }} affected?
        id: affected
        run: |
          if pnpm exec turbo ls --affected --output=json | node -e '
            let d = ""; process.stdin.on("data", (c) => (d += c)).on("end", () => {
              const names = JSON.parse(d).packages.items.map((p) => p.name);
              process.exit(names.includes("@ros/${{ matrix.app }}") ? 0 : 1);
            });'; then echo "affected=true" >> "$GITHUB_OUTPUT"; else echo "affected=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.affected.outputs.affected == 'true'
      - name: Build ros-${{ matrix.app }}
        if: steps.affected.outputs.affected == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/next-app.Dockerfile
          build-args: APP=${{ matrix.app }}
          tags: ros-${{ matrix.app }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Image size
        if: steps.affected.outputs.affected == 'true'
        run: docker images ros-${{ matrix.app }}:ci
