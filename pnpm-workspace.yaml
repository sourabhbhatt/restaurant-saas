packages:
  - "apps/*"
  - "packages/*"
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@swc/core"
onlyBuiltDependencies:
  - esbuild
overrides:
  # One browserslist for the whole tree. Two versions made pnpm install two
  # peer variants of serwist, which broke the service worker's /~offline
  # fallback (see docs/offline-sync.md).
  browserslist: 4.29.5
  # @serwist/turbopack pins zod 4.6.5 (GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6); the
  # whole tree uses one patched zod.
  zod: 4.6.7
